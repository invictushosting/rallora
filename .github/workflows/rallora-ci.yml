      - run: psql -v ON_ERROR_STOP=1 -f scripts/staging/ci_captain_draft_visibility_assertions.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026193000_admin_late_team_entry.sql
